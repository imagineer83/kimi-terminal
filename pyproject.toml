[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimi-terminal"
version = "0.1.0"
description = "Bloomberg-style terminal for A-share and HK stock data"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "textual-dev>=1.0",
]

[project.scripts]
kmt = "kimi_terminal.cli:main"
